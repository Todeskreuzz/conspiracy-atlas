name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cost-check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
# Deployment is intentionally not automated here: it needs Cloudflare credentials,
# which are never stored in GitHub. Use Cloudflare Pages' Git integration or deploy
# manually (docs/DEPLOYMENT.md).
