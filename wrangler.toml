# Cloudflare Pages configuration for The Conspiracy Atlas.
#
# FREE-ONLY CONFIGURATION. This project binds exactly one Cloudflare service
# besides Pages itself: D1 (included in Workers Free). Community images are
# stored in D1 as well, capped by IMAGE_STORAGE_LIMIT_MB. There are intentionally
# NO bindings for R2, KV, Queues, Durable Objects, Workers AI, Vectorize,
# Images, Stream, Browser Rendering or Hyperdrive. `npm run cost-check` fails
# the build if any such binding is added.
#
# Secrets (TURNSTILE_SECRET_KEY, ADMIN_USERNAME, ADMIN_PASSWORD_HASH,
# SESSION_SECRET) are NEVER stored here. Set them interactively with
#   npx wrangler pages secret put <NAME> --project-name conspiracy-atlas
# See docs/DEPLOYMENT.md.

name = "conspiracy-atlas"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

[vars]
FEATURE_COMMUNITY_SUBMISSIONS = "true"
FEATURE_COMMUNITY_UPLOADS = "true"    # images are compressed and stored in D1 (never R2)
IMAGE_STORAGE_LIMIT_MB = "250"        # total image budget; the free D1 database holds 500 MB
FEATURE_MAP_DATA = "true"
FEATURE_AUTOMATIC_IMPORT = "true"     # Wikidata/Wikipedia import, triggered by .github/workflows/import.yml
FEATURE_TURNSTILE = "true"            # free Turnstile widget for conspiracy-atlas.pages.dev
FEATURE_ADMIN_PANEL = "true"
FEATURE_INVESTIGATIONS = "true"
FEATURE_REPORTS = "true"
FEATURE_ACCOUNTS = "true"             # visitor accounts and profile pages, stored in D1
# Public Turnstile site key (not a secret). The secret key is set with wrangler pages secret put.
TURNSTILE_SITE_KEY = "0x4AAAAAAFsJ72PHY21MeM2j"
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "conspiracy-atlas-db"
# Production D1 database (Free plan), created with `npx wrangler d1 create conspiracy-atlas-db`.
# The id is not a secret; local development uses a local copy of the same binding.
database_id = "f40a05cf-2834-4552-ab1a-221ac6fe4f61"
migrations_dir = "migrations/d1"
